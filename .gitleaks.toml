title = "Enterprise GitOps Secret Rules"

[allowlist]
  description = "Global allowlist for development configuration files"
  paths = [
    '''poetry\\.lock''',
    '''package-lock\\.json''',
    '''yarn\\.lock''',
    '''monitoring/grafana/dashboards/.*'''
  ]

[[rules]]
  id = "aws-access-key-id"
  description = "AWS Access Key ID"
  regex = '''(A3T[A-Z0-9]|AKIA|AGPA|AIDA|AROA|AIPA|ANPA|ANVA|ASIA)[A-Z0-9]{16}'''
  tags = ["key","AWS"]

[[rules]]
  id = "aws-secret-access-key"
  description = "AWS Secret Access Key"
  regex = '''(?i)aws_(?:secret_)?access_key\s*[:=]\s*['"]([A-Za-z0-9/+=]{40})['"]'''
  secretGroup = 1
  tags = ["key","AWS"]

[[rules]]
  id = "github-pat"
  description = "GitHub Personal Access Token"
  regex = '''ghp_[0-9a-zA-Z]{36}|github_pat_[0-9a-zA-Z]{82}'''
  tags = ["key","GitHub"]

[[rules]]
  id = "generic-private-key"
  description = "Generic Private Key"
  regex = '''-----BEGIN\s+([A-Z0-9\s_]+)\s+PRIVATE\s+KEY-----'''
  tags = ["key","SSH","TLS"]
