version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'America/Los_Angeles'
    open-pull-requests-limit: 10
    commit-message:
      prefix: 'chore'
      prefix-development: 'chore'
      include: 'scope'
    labels:
      - 'dependencies'
      - 'github-actions'
      - 'automated'
    reviewers:
      - 'platform-lead'
      - 'senior-devops'
    assignees:
      - 'devops-team'
    milestone: 'platform-maintenance'
    allow:
      - dependency-type: 'direct'
    ignore:
      - dependency-name: 'actions/upload-artifact'
        versions: ['<=3.x']
    rebase-strategy: 'auto'

  - package-ecosystem: 'docker'
    directory: '/microservices/frontend-service'
    schedule:
      interval: 'weekly'
      day: 'tuesday'
      time: '09:00'
      timezone: 'America/Los_Angeles'
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'docker'
      include: 'scope'
    labels:
      - 'dependencies'
      - 'docker'
      - 'automated'
    reviewers:
      - 'frontend-lead'
    assignees:
      - 'frontend-team'
    allow:
      - dependency-type: 'direct'
    rebase-strategy: 'auto'

  - package-ecosystem: 'docker'
