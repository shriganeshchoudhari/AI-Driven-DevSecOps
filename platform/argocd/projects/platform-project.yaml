apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
spec:
  description: Platform infrastructure components
  sourceRepos:
    - 'https://github.com/shriganeshchoudhari/AI-Driven-DevSecOps.git'
    - 'https://charts.bitnami.com/bitnami'
    - 'https://prometheus-community.github.io/helm-charts'
    - 'https://grafana.github.io/helm-charts'
    - 'https://kubernetes.github.io/ingress-nginx'
    - 'https://charts.jetstack.io'
    - 'https://kyverno.github.io/kyverno'
    - 'https://falcosecurity.github.io/charts'
    - 'https://kedacore.github.io/charts'
    - 'https://charts.chaos-mesh.org'
    - 'https://argoproj.github.io/argo-helm'
    - 'https://charts.external-secrets.io'
  destinations:
    - namespace: '*'
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
  roles:
    - name: team-admin
      description: Platform team admin access
      policies:
        - p, proj:platform:team-admin, applications, *, platform/*, allow
      groups:
        - platform-team
  orphanedResources:
    warn: false
