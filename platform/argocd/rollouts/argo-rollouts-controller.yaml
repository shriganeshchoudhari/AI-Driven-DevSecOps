apiVersion: v1
kind: ConfigMap
metadata:
  name: argo-rollouts-config
  namespace: argocd
data:
  version: "latest"
  trafficRouting: |
    plugins:
      - name: "alb"
        type: "aws-load-balancer-controller"
---
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: frontend-service
  namespace: frontend-service
spec:
  replicas: 5
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: frontend-service
  template:
    metadata:
      labels:
        app: frontend-service
    spec:
      containers:
        - name: frontend
          image: 123456789.dkr.ecr.us-west-2.amazonaws.com/frontend-service:latest
          ports:
            - containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
  strategy:
    canary:
      steps:
        - setWeight: 10
        - pause: {duration: 2m}
        - setWeight: 25
        - pause: {duration: 5m}
        - setWeight: 50
        - pause: {duration: 10m}
        - setWeight: 75
        - pause: {duration: 5m}
        - setWeight: 90
        - pause: {duration: 5m}
        - setWeight: 100
      analysis:
        templates:
          - templateName: success-rate
        args:
          - name: service-name
            value: frontend-service
      trafficRouting:
        alb:
          ingress: frontend-ingress
          service: frontend-service-preview
          annotationPrefix: alb.ingress.kubernetes.io
---
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: success-rate
  namespace: frontend-service
spec:
  args:
    - name: service-name
  metrics:
    - name: success-rate
      successCondition: result[0] >= 0.95
      failureLimit: 3
      interval: 60s
      count: 5
      provider:
        prometheus:
          address: http://prometheus-operated.monitoring:9090
          query: |
            sum(rate(
              http_requests_total{service="{{args.service-name}}",status=~"2[0-9]{2}"}[5m]
            )) / sum(rate(
              http_requests_total{service="{{args.service-name}}"}[5m]
            ))
    - name: error-rate
      successCondition: result[0] <= 0.01
      failureLimit: 2
      interval: 30s
      count: 10
      provider:
        prometheus:
          address: http://prometheus-operated.monitoring:9090
          query: |
            sum(rate(
              http_requests_total{service="{{args.service-name}}",status=~"5[0-9]{2}"}[5m]
            )) / sum(rate(
              http_requests_total{service="{{args.service-name}}"}[5m]
            ))
    - name: latency-p99
      successCondition: result[0] <= 500
      failureLimit: 3
      interval: 60s
      count: 5
      provider:
        prometheus:
          address: http://prometheus-operated.monitoring:9090
          query: |
            histogram_quantile(0.99, sum(rate(
              http_request_duration_seconds_bucket{service="{{args.service-name}}"}[5m]
            )) by (le))
