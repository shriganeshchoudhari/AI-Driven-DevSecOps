---
# =============================================================================
# Compliance Reporting CronJob
# Generates periodic compliance reports and sends to AIOps engine
# =============================================================================

apiVersion: batch/v1
kind: CronJob
metadata:
  name: psa-compliance-reporter
  namespace: kube-system
  labels:
    app: psa-compliance-reporter
    cyber-secure: "true"
spec:
  schedule: "0 6 * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 86400
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: psa-compliance-reporter
            cyber-secure: "true"
        spec:
          serviceAccountName: psa-compliance-reporter
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          restartPolicy: OnFailure
          containers:
            - name: reporter
              image: 123456789012.dkr.ecr.us-west-2.amazonaws.com/bitnami/kubectl:1.28
              imagePullPolicy: IfNotPresent
              securityContext:
                allowPrivilegeEscalation: false
                privileged: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              command:
                - /bin/bash
                - -c
                - |
                  set -e
                  echo "=== Pod Security Standards Compliance Report ==="
                  echo "Date: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
                  echo ""

                  CHECK_PASS=0
                  CHECK_FAIL=0

                  check_pss() {
                    local namespace=$1
                    local level=$2
                    local result=$(kubectl get namespace $namespace -o json | \
                      jq -r '.metadata.labels["pod-security.kubernetes.io/enforce"] // "none"')
                    if [ "$result" == "$level" ]; then
                      echo "PASS: $namespace enforces $level"
                      CHECK_PASS=$((CHECK_PASS + 1))
                    else
                      echo "FAIL: $namespace has $result (expected $level)"
                      CHECK_FAIL=$((CHECK_FAIL + 1))
                    fi
                  }

                  check_pss "frontend-service" "restricted"
                  check_pss "auth-service" "restricted"
                  check_pss "payment-service" "restricted"
                  check_pss "notification-service" "restricted"
                  check_pss "aiops-engine" "restricted"
                  check_pss "external-secrets" "restricted"
                  check_pss "cert-manager" "restricted"
                  check_pss "keda" "restricted"

                  echo ""
                  echo "=== Summary ==="
                  echo "Pass: $CHECK_PASS"
                  echo "Fail: $CHECK_FAIL"
                  echo "Total: $((CHECK_PASS + CHECK_FAIL))"

                  if [ $CHECK_FAIL -gt 0 ]; then
                    echo "COMPLIANCE: NON-COMPLIANT ($CHECK_FAIL failures)"
                    exit 1
                  else
                    echo "COMPLIANCE: COMPLIANT (100%)"
                  fi
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
---
# =============================================================================
# Service Account for Compliance Reporter
# =============================================================================

apiVersion: v1
kind: ServiceAccount
metadata:
  name: psa-compliance-reporter
  namespace: kube-system
  labels:
    app: psa-compliance-reporter
    cyber-secure: "true"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: psa-compliance-reporter
  labels:
    app: psa-compliance-reporter
    cyber-secure: "true"
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["wgpolicyk8s.io"]
    resources: ["policyreports", "clusterpolicyreports"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: psa-compliance-reporter
subjects:
  - kind: ServiceAccount
    name: psa-compliance-reporter
    namespace: kube-system
roleRef:
  kind: ClusterRole
  name: psa-compliance-reporter
  apiGroup: rbac.authorization.k8s.io
