# Value overrides for aiops-engine in dev
replicaCount: 1

image:
  repository: aiops-engine
  tag: dev-latest

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: "500m"
    memory: "512Mi"

ingress:
  enabled: true
  hosts:
    - host: aiops-engine.dev.example.com
      paths:
        - path: /
          pathType: Prefix

env:
  LOG_LEVEL: "INFO"
  VECTOR_DB_PATH: "/tmp/vectorstore"

global:
  labels:
    app.kubernetes.io/environment: dev

monitoring:
  enabled: false

nodeSelector: {}
affinity: {}
tolerations: []
