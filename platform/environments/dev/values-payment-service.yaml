# Value overrides for payment-service in dev
replicaCount: 1

image:
  repository: payment-service
  tag: dev-latest

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: "500m"
    memory: "512Mi"

ingress:
  enabled: true
  hosts:
    - host: payment.dev.example.com
      paths:
        - path: /
          pathType: Prefix

env:
  DATABASE_URL: "sqlite:////tmp/payments.db"
  LOG_LEVEL: "INFO"

global:
  labels:
    app.kubernetes.io/environment: dev

monitoring:
  enabled: false

nodeSelector: {}
affinity: {}
tolerations: []
