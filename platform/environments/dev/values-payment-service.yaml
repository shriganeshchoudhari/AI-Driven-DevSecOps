# Value overrides for payment-service in dev
replicaCount: 1

image:
  tag: dev-latest

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: "500m"
    memory: "512Mi"

ingress:
  enabled: true
  hosts:
    - host: payment.dev.example.com
      paths:
        - path: /
          pathType: Prefix

global:
  labels:
    app.kubernetes.io/environment: dev
