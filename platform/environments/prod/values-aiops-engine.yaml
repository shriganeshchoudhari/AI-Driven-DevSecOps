# Value overrides for aiops-engine in prod
replicaCount: 3

image:
  tag: 1.0.0

resources:
  requests:
    cpu: 500m
    memory: 512Mi
  limits:
    cpu: "1500m"
    memory: "1536Mi"

ingress:
  enabled: true
  hosts:
    - host: aiops-engine.example.com
      paths:
        - path: /
          pathType: Prefix

global:
  labels:
    app.kubernetes.io/environment: prod
