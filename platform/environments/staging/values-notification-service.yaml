# Value overrides for notification-service in staging
replicaCount: 2

image:
  tag: staging-latest

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: "1000m"
    memory: "1024Mi"

ingress:
  enabled: true
  hosts:
    - host: notification.staging.example.com
      paths:
        - path: /
          pathType: Prefix

global:
  labels:
    app.kubernetes.io/environment: staging
