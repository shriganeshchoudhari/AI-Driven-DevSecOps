apiVersion: v1
kind: Secret
metadata:
  name: aiops-engine-secrets
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "aiops-engine.labels" . | nindent 4 }}
  annotations:
    sealedsecrets.bitnami.com/managed: "true"
type: Opaque
data:
  {{- if .Values.envFrom }}
  {{- range .Values.envFrom }}
  {{- if .secretRef }}
  {{- end }}
  {{- end }}
  {{- end }}
  API_KEY: ""
  DB_PASSWORD: ""
