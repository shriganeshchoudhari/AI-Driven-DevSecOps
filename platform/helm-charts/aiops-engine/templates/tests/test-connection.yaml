apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "aiops-engine.fullname" . }}-test-connection"
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "aiops-engine.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: hook-succeeded,before-hook-creation
spec:
  containers:
    - name: wget
      image: busybox:1.36
      command:
        - wget
      args:
        - "--timeout=10"
        - "--spider"
        - "http://{{ include "aiops-engine.fullname" . }}:{{ .Values.service.port }}/health"
  restartPolicy: Never
