# -- Number of replicas
replicaCount: 3

# -- Image configuration
image:
  repository: 123456789.dkr.ecr.us-west-2.amazonaws.com/auth-service
  tag: latest
  pullPolicy: IfNotPresent

# -- Image pull secrets
imagePullSecrets:
  - name: regcred

# -- Name overrides
nameOverride: ""
fullnameOverride: ""

# -- Service account configuration
serviceAccount:
  create: true
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::123456789:role/auth-service-irsa
  name: "auth-service"

# -- Annotations to add to pods
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8080"
  prometheus.io/path: "/metrics"

# -- Pod security context
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001
  fsGroup: 1001
  seccompProfile:
    type: RuntimeDefault

# -- Container security context
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1001
  privileged: false

# -- Service configuration
service:
  type: ClusterIP
  port: 8080
  targetPort: 8080
  protocol: TCP
  name: http

# -- Ingress configuration
ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: auth.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: auth-tls
      hosts:
        - auth.example.com

# -- Resource limits and requests
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

# -- Horizontal Pod Autoscaler configuration
autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 20
  targetCPUUtilizationPercentage: 75
  targetMemoryUtilizationPercentage: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 4
          periodSeconds: 15
      selectPolicy: Max

# -- Environment variables
env:
  LOG_LEVEL: info
  APP_ENV: production
  API_BASE_URL: https://api.example.com
  FEATURE_FLAG_NEW_UI: "true"

# -- Environment from sources
envFrom:
  - configMapRef:
      name: auth-service-config
  - secretRef:
      name: auth-service-secrets

# -- Volumes
volumes:
  - name: tmp
    emptyDir:
      sizeLimit: 100Mi
  - name: cache
    emptyDir:
      sizeLimit: 500Mi

# -- Volume mounts
volumeMounts:
  - name: tmp
    mountPath: /tmp
  - name: cache
    mountPath: /var/cache

# -- Node selector
nodeSelector:
  node-type: general-purpose

# -- Tolerations
tolerations:
  - key: "CriticalAddonsOnly"
    operator: "Equal"
    value: "true"
    effect: "NoSchedule"
  - key: "node.kubernetes.io/not-ready"
    operator: "Exists"
    effect: "NoExecute"
    tolerationSeconds: 300

# -- Affinity / anti-affinity
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - auth-service
          topologyKey: topology.kubernetes.io/zone
      - weight: 50
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - auth-service
          topologyKey: kubernetes.io/hostname
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: node-type
              operator: In
              values:
                - general-purpose
                - compute-optimized

# -- Probes configuration
probes:
  liveness:
    enabled: true
    path: /health
    port: 8080
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
    successThreshold: 1
  readiness:
    enabled: true
    path: /ready
    port: 8080
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
    successThreshold: 1
  startup:
    enabled: true
    path: /startup
    port: 8080
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 30
    successThreshold: 1

# -- Service mesh configuration
serviceMesh:
  enabled: true
  sidecarInject: true
  protocol: http
  retries:
    attempts: 3
    perTryTimeout: 2s
  circuitBreaker:
    maxConnections: 100
    maxPendingRequests: 10
    maxRequests: 50
    maxRetries: 3

# -- Monitoring configuration
monitoring:
  enabled: true
  serviceMonitor:
    enabled: true
    namespace: monitoring
    interval: 30s
    scrapeTimeout: 10s
    honorLabels: true
    honorTimestamps: true
    relabelings:
      - sourceLabels: [__meta_kubernetes_pod_node_name]
        targetLabel: node
    metricRelabelings:
      - sourceLabels: [__name__]
        regex: "^http_.*"
        action: keep
    targetLabels:
      - app
      - environment
  prometheusRules:
    enabled: true
    namespace: monitoring
    rules:
      - alert: FrontendHighErrorRate
        expr: rate(http_requests_total{service="auth-service",status=~"5.."}[5m]) / rate(http_requests_total{service="auth-service"}[5m]) > 0.01
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Frontend service error rate is high"
          description: "Frontend service error rate is {{ $value | humanizePercentage }} for the last 5 minutes"
      - alert: FrontendHighLatency
        expr: histogram_quantile(0.99, sum(rate(http_request_duration_seconds_bucket{service="auth-service"}[5m])) by (le)) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Frontend service latency is high"
          description: "Frontend service p99 latency is {{ $value | humanizeDuration }} for the last 5 minutes"

# -- Pod Disruption Budget configuration
pdb:
  enabled: true
  minAvailable: 2
  maxUnavailable: ""

# -- Common Bitnami chart configuration
common:
  enabled: false

# -- Additional labels for all resources
global:
  labels:
    app.kubernetes.io/part-of: aiops-platform
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/environment: production

# -- Argo Rollouts Canary configuration
rollout:
  enabled: false
  analysis:
    templateName: prometheus-metrics
