apiVersion: v1
kind: ConfigMap
metadata:
  name: payment-service-config
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "payment-service.labels" . | nindent 4 }}
data:
  {{- range $key, $value := .Values.env }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  NODE_NAME: {{ include "payment-service.fullname" . | quote }}
