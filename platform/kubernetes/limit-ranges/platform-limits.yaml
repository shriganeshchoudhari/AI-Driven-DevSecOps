---
apiVersion: v1
kind: LimitRange
metadata:
  name: platform-limits
  namespace: frontend-service
  labels:
    cyber-secure: "true"
spec:
  limits:
    - default:
        cpu: "500m"
        memory: "512Mi"
      defaultRequest:
        cpu: "250m"
        memory: "256Mi"
      max:
        cpu: "2"
        memory: "2Gi"
      min:
        cpu: "50m"
        memory: "64Mi"
      type: Container
    - max:
        storage: "50Gi"
      type: PersistentVolumeClaim
