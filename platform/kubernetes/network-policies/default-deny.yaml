---
# =============================================================================
# Default Deny-All Network Policies
# Every namespace gets a default-deny ingress + egress policy
# =============================================================================

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: frontend-service
  annotations:
    cyber-secure: "true"
    description: "Deny all ingress and egress traffic by default"
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
