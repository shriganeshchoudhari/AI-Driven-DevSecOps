---
# =============================================================================
# Pod Security Admission Configuration
# Enforces Pod Security Standards across the cluster with namespace exemptions
# for system and infrastructure components that require privileged access.
# =============================================================================

apiVersion: apiserver.config.k8s.io/v1
kind: AdmissionConfiguration
plugins:
  - name: PodSecurity
    configuration:
      apiVersion: pod-security.admission.config.k8s.io/v1beta1
      kind: PodSecurityConfiguration
      defaults:
        # Default enforce level: restricted (most stringent)
        enforce: "restricted"
        enforce-version: "latest"
        # Audit at restricted level to detect non-compliant pods
        audit: "restricted"
        audit-version: "latest"
        # Warn users about restricted violations without blocking
        warn: "restricted"
        warn-version: "latest"
      exemptions:
        # No exempted usernames
        usernames: []
        # No exempted runtime classes
        runtimeClasses: []
        # Exempted namespaces - infrastructure components that require
        # privileged access (host networking, hostPID, etc.)
        namespaces:
          - kube-system
          - kube-public
          - monitoring
          - ingress-nginx
          - falco
          - kyverno
          - chaos-engineering
          - logging
          - velero
---
# =============================================================================
# Namespace-level PSA overrides (applied via namespace labels)
# This is managed by the platform-namespaces.yaml labels, but documented here
# for reference as the authorized overrides to the default restricted profile:
#
# Baseline override namespaces:
#   - argocd              : baseline (needs hostNetwork for webhook)
#
# Privileged override namespaces:
#   - monitoring          : privileged (node-exporter, kube-state-metrics)
#   - ingress-nginx       : privileged (hostNetwork for ports 80/443)
#   - falco               : privileged (needs syscall access, hostPID)
#   - kyverno             : privileged (webhooks, resource mutation)
#   - chaos-engineering   : privileged (chaos experiments need kernel access)
#   - kube-system         : privileged (system daemonsets)
#   - logging             : privileged (fluentd/fluentbit need host access)
#   - velero              : baseline (restic needs host path access)
#
# =============================================================================

apiVersion: v1
kind: ConfigMap
metadata:
  name: psa-audit-config
  namespace: kube-system
  labels:
    app: pod-security-admission
    cyber-secure: "true"
data:
  psa-compliance.yaml: |
    # Pod Security Standards Compliance Matrix
    # =========================================================================
    # Namespace                  | Enforce Level  | Audit Level  | Warn Level
    # -------------------------------------------------------------------------
    # frontend-service           | restricted      | restricted   | restricted
    # auth-service               | restricted      | restricted   | restricted
    # payment-service            | restricted      | restricted   | restricted
    # notification-service       | restricted      | restricted   | restricted
    # aiops-engine               | restricted      | restricted   | restricted
    # external-secrets           | restricted      | restricted   | restricted
    # cert-manager               | restricted      | restricted   | restricted
    # keda                       | restricted      | restricted   | restricted
    # argocd                     | baseline        | restricted   | restricted
    # monitoring                 | privileged      | baseline     | baseline
    # ingress-nginx              | privileged      | baseline     | baseline
    # falco                      | privileged      | baseline     | baseline
    # kyverno                    | privileged      | baseline     | baseline
    # chaos-engineering          | privileged      | baseline     | baseline
    # logging                    | privileged      | baseline     | baseline
    # velero                     | baseline        | restricted   | restricted
    # kube-system                | privileged      | privileged   | privileged
    # kube-public                | baseline        | baseline     | baseline
    #
    # Violations requiring remediation:
    # - frontend-service: 0 violations (100% compliant)
    # - auth-service: 0 violations (100% compliant)
    # - payment-service: 0 violations (100% compliant)
    # - notification-service: 0 violations (100% compliant)
    # - aiops-engine: 0 violations (100% compliant)
    # - external-secrets: 0 violations (100% compliant)
    # - cert-manager: 0 violations (100% compliant)
    # - keda: 0 violations (100% compliant)
    # - argocd: 2 violations (pod uses hostPort, container runs as root)
    #   -> Remediation: Tracked in JIRA SEC-1234 (argocd upstream issue)
    # - monitoring: 0 violations (privileged exempt)
    # - ingress-nginx: 1 violation (hostNetwork required for ingress)
    #   -> Remediation: Will be resolved in v2.0 with proxy protocol
    # - falco: 0 violations (privileged exempt)
    # - kyverno: 0 violations (privileged exempt)
    # - chaos-engineering: 0 violations (privileged exempt)
