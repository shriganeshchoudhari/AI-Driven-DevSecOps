---
# =============================================================================
# Service Accounts - Each microservice gets a dedicated service account
# with IRSA annotations for AWS IAM integration
# =============================================================================

apiVersion: v1
kind: ServiceAccount
metadata:
  name: frontend-service
  namespace: frontend-service
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/frontend-service-irsa
    eks.amazonaws.com/sts-regional-endpoints: "true"
    eks.amazonaws.com/token-expiration: "86400"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: auth-service
  namespace: auth-service
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/auth-service-irsa
    eks.amazonaws.com/sts-regional-endpoints: "true"
    eks.amazonaws.com/token-expiration: "86400"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: payment-service
  namespace: payment-service
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/payment-service-irsa
    eks.amazonaws.com/sts-regional-endpoints: "true"
    eks.amazonaws.com/token-expiration: "86400"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: notification-service
  namespace: notification-service
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/notification-service-irsa
    eks.amazonaws.com/sts-regional-endpoints: "true"
    eks.amazonaws.com/token-expiration: "86400"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aiops-engine
  namespace: aiops-engine
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/aiops-engine-irsa
    eks.amazonaws.com/sts-regional-endpoints: "true"
    eks.amazonaws.com/token-expiration: "86400"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aiops-engine-cronjob
  namespace: aiops-engine
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/aiops-engine-cronjob-irsa
    eks.amazonaws.com/sts-regional-endpoints: "true"
---
# =============================================================================
# FRONTEND-SERVICE ROLE & BINDINGS
# =============================================================================

apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: frontend-service
  namespace: frontend-service
rules:
  - apiGroups: [""]
    resources: ["services", "endpoints", "pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
    resourceNames:
      - "frontend-tls"
      - "app-secrets"
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch", "create", "patch"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: frontend-service
  namespace: frontend-service
subjects:
  - kind: ServiceAccount
    name: frontend-service
    namespace: frontend-service
roleRef:
  kind: Role
  name: frontend-service
  apiGroup: rbac.authorization.k8s.io
---
# =============================================================================
# AUTH-SERVICE ROLE & BINDINGS
# =============================================================================

apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: auth-service
  namespace: auth-service
rules:
  - apiGroups: [""]
    resources: ["services", "endpoints", "pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
    resourceNames:
      - "auth-tls"
      - "app-secrets"
      - "jwt-keys"
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch", "create", "patch"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: auth-service
  namespace: auth-service
subjects:
  - kind: ServiceAccount
    name: auth-service
    namespace: auth-service
roleRef:
  kind: Role
  name: auth-service
  apiGroup: rbac.authorization.k8s.io
---
# =============================================================================
# PAYMENT-SERVICE ROLE & BINDINGS
# =============================================================================

apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: payment-service
  namespace: payment-service
rules:
  - apiGroups: [""]
    resources: ["services", "endpoints", "pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
    resourceNames:
      - "payment-tls"
      - "app-secrets"
      - "stripe-keys"
      - "db-credentials"
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch", "create", "patch"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: payment-service
  namespace: payment-service
subjects:
  - kind: ServiceAccount
    name: payment-service
    namespace: payment-service
roleRef:
  kind: Role
  name: payment-service
  apiGroup: rbac.authorization.k8s.io
---
# =============================================================================
# NOTIFICATION-SERVICE ROLE & BINDINGS
# =============================================================================

apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: notification-service
  namespace: notification-service
rules:
  - apiGroups: [""]
    resources: ["services", "endpoints", "pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
    resourceNames:
      - "notification-tls"
      - "app-secrets"
      - "smtp-credentials"
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch", "create", "patch"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: notification-service
  namespace: notification-service
subjects:
  - kind: ServiceAccount
    name: notification-service
    namespace: notification-service
roleRef:
  kind: Role
  name: notification-service
  apiGroup: rbac.authorization.k8s.io
---
# =============================================================================
# AIOPS-ENGINE ROLE & BINDINGS
# =============================================================================

apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aiops-engine
  namespace: aiops-engine
rules:
  - apiGroups: [""]
    resources: ["services", "endpoints", "pods", "nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
    resourceNames:
      - "aiops-api-keys"
      - "app-secrets"
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aiops-engine
  namespace: aiops-engine
subjects:
  - kind: ServiceAccount
    name: aiops-engine
    namespace: aiops-engine
roleRef:
  kind: Role
  name: aiops-engine
  apiGroup: rbac.authorization.k8s.io
---
# =============================================================================
# CLUSTER ROLES
# =============================================================================

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: microservice-discovery
  labels:
    cyber-secure: "true"
    rbac.authorization.k8s.io/aggregate-to-view: "true"
rules:
  - apiGroups: [""]
    resources: ["services", "endpoints"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: aiops-cluster-reader
  labels:
    cyber-secure: "true"
rules:
  - apiGroups: [""]
    resources: ["nodes", "nodes/status", "nodes/proxy"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods", "pods/log", "pods/status"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies", "ingresses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods", "nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: istio-sidecar-reader
  labels:
    cyber-secure: "true"
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
    resourceNames:
      - "istio-sidecar-injector"
      - "istio-ca-root-cert"
  - apiGroups: ["networking.istio.io"]
    resources: ["virtualservices", "destinationrules", "serviceentries", "gateways"]
    verbs: ["get", "list", "watch"]
---
# =============================================================================
# CLUSTER ROLE BINDINGS
# =============================================================================

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: frontend-service-discovery
subjects:
  - kind: ServiceAccount
    name: frontend-service
    namespace: frontend-service
roleRef:
  kind: ClusterRole
  name: microservice-discovery
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: auth-service-discovery
subjects:
  - kind: ServiceAccount
    name: auth-service
    namespace: auth-service
roleRef:
  kind: ClusterRole
  name: microservice-discovery
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: payment-service-discovery
subjects:
  - kind: ServiceAccount
    name: payment-service
    namespace: payment-service
roleRef:
  kind: ClusterRole
  name: microservice-discovery
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: notification-service-discovery
subjects:
  - kind: ServiceAccount
    name: notification-service
    namespace: notification-service
roleRef:
  kind: ClusterRole
  name: microservice-discovery
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: aiops-engine-cluster-reader
subjects:
  - kind: ServiceAccount
    name: aiops-engine
    namespace: aiops-engine
roleRef:
  kind: ClusterRole
  name: aiops-cluster-reader
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: aiops-engine-discovery
subjects:
  - kind: ServiceAccount
    name: aiops-engine
    namespace: aiops-engine
roleRef:
  kind: ClusterRole
  name: microservice-discovery
  apiGroup: rbac.authorization.k8s.io
