---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: platform-quota
  namespace: frontend-service
  labels:
    cyber-secure: "true"
    tier: frontend
spec:
  hard:
    requests.cpu: "4"
    requests.memory: "8Gi"
    limits.cpu: "8"
    limits.memory: "16Gi"
    requests.ephemeral-storage: "10Gi"
    limits.ephemeral-storage: "20Gi"
    persistentvolumeclaims: "2"
    pods: "20"
    services: "5"
    secrets: "20"
    configmaps: "20"
    count/deployments.apps: "5"
