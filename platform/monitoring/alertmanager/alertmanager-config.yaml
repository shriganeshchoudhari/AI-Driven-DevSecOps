global:
  resolve_timeout: 5m
  slack_api_url: "${SLACK_API_URL}"
  pagerduty_url: "https://events.pagerduty.com/v2/enqueue"
  opsgenie_api_url: "https://api.opsgenie.com/v2"
  http_config:
    follow_redirects: true
    tls_config:
      insecure_skip_verify: false

route:
  receiver: default
  group_by:
    - alertname
    - cluster
    - service
    - namespace
    - severity
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - receiver: pagerduty-critical
      match:
        severity: critical
      repeat_interval: 1h
      continue: true

    - receiver: slack-critical
      match:
        severity: critical
      repeat_interval: 1h
      continue: true

    - receiver: slack-warning
      match:
        severity: warning
      repeat_interval: 4h

    - receiver: slack-security
      match:
        team: security
      repeat_interval: 1h

    - receiver: slack-platform
      match:
        team: platform
      repeat_interval: 2h

    - receiver: slack-info
      match:
        severity: info
      repeat_interval: 8h

    - receiver: opsgenie-critical
      match:
        severity: critical
      repeat_interval: 1h

inhibit_rules:
  - source_match:
      severity: critical
    target_match:
      severity: warning
    equal:
      - alertname
      - service
      - namespace

  - source_match:
      alertname: KubernetesNodeNotReady
    target_match:
      alertname: KubernetesPodNotReady
    equal:
      - node

  - source_match:
      alertname: KubernetesNodeNotReady
    target_match:
      alertname: KubernetesDeploymentReplicasMismatch
    equal:
      - node

  - source_match:
      alertname: ServiceDown
    target_match:
      alertname: HighErrorRate
    equal:
      - service

  - source_match:
      alertname: ServiceDown
    target_match:
      alertname: HighLatencyP99
    equal:
      - service

  - source_match:
      severity: critical
    target_match:
      severity: info
    equal:
      - alertname

receivers:
  - name: default
    slack_configs:
      - channel: "#alerts-default"
        title: '{{ template "slack.title" . }}'
        text: '{{ template "slack.text" . }}'
        color: '{{ if eq .Status "firing" }}danger{{ else }}good{{ end }}'
        send_resolved: true

  - name: slack-critical
    slack_configs:
      - channel: "#alerts-critical"
        title: "[CRITICAL] {{ template "slack.title" . }}"
        text: '{{ template "slack.text" . }}'
        color: danger
        send_resolved: true
        actions:
          - type: button
            text: "Runbook :book:"
            url: '{{ .Annotations.runbook }}'
          - type: button
            text: "Dashboard :bar_chart:"
            url: '{{ .Annotations.dashboard }}'
          - type: button
            text: "Silence :no_bell:"
            url: '{{ template "silence.url" . }}'

  - name: slack-warning
    slack_configs:
      - channel: "#alerts-warning"
        title: "[WARNING] {{ template "slack.title" . }}"
        text: '{{ template "slack.text" . }}'
        color: warning
        send_resolved: true

  - name: slack-security
    slack_configs:
      - channel: "#alerts-security"
        title: "[SECURITY] {{ template "slack.title" . }}"
        text: '{{ template "slack.text" . }}'
        color: "#ff0000"
        send_resolved: true
        actions:
          - type: button
            text: "Runbook :book:"
            url: '{{ .Annotations.runbook }}'
          - type: button
            text: "Dashboard :bar_chart:"
            url: '{{ .Annotations.dashboard }}'

  - name: slack-platform
    slack_configs:
      - channel: "#platform-ops"
        title: "[PLATFORM] {{ template "slack.title" . }}"
        text: '{{ template "slack.text" . }}'
        color: "#36a64f"
        send_resolved: true

  - name: slack-info
    slack_configs:
      - channel: "#alerts-info"
        title: "[INFO] {{ template "slack.title" . }}"
        text: '{{ template "slack.text" . }}'
        color: "#808080"
        send_resolved: true

  - name: pagerduty-critical
    pagerduty_configs:
      - routing_key: "${PAGERDUTY_ROUTING_KEY}"
        severity: critical
        description: '{{ .Annotations.summary }}'
        details:
          firing: '{{ template "pagerduty.text" . }}'
          client: "AIOps Platform Alertmanager"
          client_url: "https://alertmanager.aiops-platform.internal"
          annotations: '{{ .Annotations }}'
          labels: '{{ .Labels }}'
        images:
          - src: "https://grafana.aiops-platform.internal/avatar/alertmanager.png"
            href: "https://grafana.aiops-platform.internal"
            alt: "Grafana"
        links:
          - href: '{{ .Annotations.dashboard }}'
            text: "Dashboard"
          - href: '{{ .Annotations.runbook }}'
            text: "Runbook"

  - name: opsgenie-critical
    opsgenie_configs:
      - api_key: "${OPSGENIE_API_KEY}"
        priority: "{{ if eq .Status "firing" }}P1{{ else }}P5{{ end }}"
        message: '{{ .Annotations.summary | default .GroupLabels.alertname }}'
        description: '{{ .Annotations.description }}'
        source: "AIOps Platform Alertmanager"
        tags: "{{ .Labels.severity }},{{ .Labels.team }},{{ .GroupLabels.alertname }}"
        note: "Generated by Alertmanager"
        details:
          cluster: "{{ .ExternalLabels.cluster }}"
          environment: "{{ .ExternalLabels.environment }}"
          firing: "{{ .Alerts.Firing | len }}"
          resolved: "{{ .Alerts.Resolved | len }}"

templates:
  - "/etc/alertmanager/templates/*.tmpl"
