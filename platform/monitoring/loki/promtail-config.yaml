server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /run/promtail/positions.yaml

clients:
  - url: http://loki.monitoring:3100/loki/api/v1/push
    batchwait: 1s
    batchsize: 1048576
    timeout: 10s
    backoff_config:
      min_period: 100ms
      max_period: 5s
      max_retries: 10

scrape_configs:
  - job_name: kubernetes-pods
    pipeline_stages:
      - cri: {}
      - regex:
          expression: "^(?P<timestamp>\\S+) (?P<stream>stdout|stderr) (?P<log>.*)$"
      - timestamp:
          source: timestamp
          format: RFC3339Nano
      - drop:
          source: stream
          value: stderr
    kubernetes_sd_configs:
      - role: pod
    relabel_configs:
      - action: keep
        regex: true
        source_labels: [__meta_kubernetes_pod_annotation_loki_io_scrape]
      - action: drop
        regex: Pending|Succeeded|Failed
        source_labels: [__meta_kubernetes_pod_phase]
      - action: replace
        source_labels: [__meta_kubernetes_namespace]
        target_label: namespace
      - action: replace
        source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
      - action: replace
        source_labels: [__meta_kubernetes_pod_container_name]
        target_label: container
      - action: replace
        source_labels: [__meta_kubernetes_pod_container_name]
        target_label: __path__
        replacement: /var/log/pods/*/$1/*.log
      - action: replace
        source_labels: [__meta_kubernetes_service_name]
        target_label: service
      - action: labelmap
        regex: __meta_kubernetes_pod_label_(.+)
      - action: replace
        replacement: /var/log/pods/*/*/*.log
        target_label: __path__
      - action: replace
        source_labels: [__meta_kubernetes_pod_node_name]
        target_label: node
      - action: replace
        source_labels: [__meta_kubernetes_pod_host_ip]
        target_label: host_ip

  - job_name: kubernetes-pods-json
    pipeline_stages:
      - cri: {}
      - regex:
          expression: "^(?P<timestamp>\\S+) (?P<stream>stdout|stderr) (?P<log>.*)$"
      - timestamp:
          source: timestamp
          format: RFC3339Nano
      - json:
          expressions:
            level: level
            severity: severity
            logger: logger
            trace_id: trace_id
            span_id: span_id
            user_id: user_id
            request_id: request_id
            error: error
            stack_trace: stack_trace
      - labels:
          level:
          severity:
          logger:
      - drop:
          source: stream
          value: stderr
    kubernetes_sd_configs:
      - role: pod
    relabel_configs:
      - action: keep
        regex: true
        source_labels: [__meta_kubernetes_pod_annotation_loki_io_scrape]
      - action: keep
        regex: "true|1|yes"
        source_labels: [__meta_kubernetes_pod_annotation_loki_io_parser_json]
      - action: drop
        regex: Pending|Succeeded|Failed
        source_labels: [__meta_kubernetes_pod_phase]
      - action: replace
        source_labels: [__meta_kubernetes_namespace]
        target_label: namespace
      - action: replace
        source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
      - action: replace
        source_labels: [__meta_kubernetes_pod_container_name]
        target_label: container
      - action: labelmap
        regex: __meta_kubernetes_pod_label_(.+)

  - job_name: kubernetes-events
    pipeline_stages:
      - json:
          expressions:
            message: message
            reason: reason
            involvedObject: involvedObject.kind
            involved_name: involvedObject.name
            involved_namespace: involvedObject.namespace
            source_component: source.component
            source_host: source.host
      - labels:
          reason:
          involvedObject:
          source_component:
    kubernetes_sd_configs:
      - role: event
    relabel_configs:
      - action: keep
        source_labels: [__meta_kubernetes_namespace]
        regex: >-
          default
          |kube-system
          |monitoring
          |aiops-engine
          |frontend-service
          |auth-service
          |payment-service
          |notification-service
          |argocd
          |kyverno
          |ingress-nginx
          |cert-manager
          |falco

  - job_name: falco-events
    static_configs:
      - targets: [localhost]
        labels:
          job: falco
          __path__: /var/log/falco_events.json
    pipeline_stages:
      - json:
          expressions:
            output: output
            priority: priority
            rule: rule
            source: source
            time: time
            hostname: hostname
            container_id: container.id
            container_name: container.name
            k8s_namespace: kubernetes.namespace
            k8s_pod: kubernetes.pod
            k8s_container: kubernetes.container
      - timestamp:
          source: time
          format: RFC3339
      - labels:
          rule:
          priority:
          source:
          k8s_namespace:
          k8s_pod:

  - job_name: kubernetes-audit
    static_configs:
      - targets: [localhost]
        labels:
          job: kubernetes-audit
          __path__: /var/log/kubernetes/audit.log
    pipeline_stages:
      - json:
          expressions:
            verb: verb
            stage: stage
            user: user.username
            groups: user.groups
            impersonatedUser: impersonatedUser.username
            objectRef_resource: objectRef.resource
            objectRef_namespace: objectRef.namespace
            objectRef_name: objectRef.name
            objectRef_subresource: objectRef.subresource
            objectRef_apiGroup: objectRef.apiGroup
            objectRef_apiVersion: objectRef.apiVersion
            requestReceivedTimestamp: requestReceivedTimestamp
            responseStatus_code: responseStatus.code
            responseStatus_reason: responseStatus.reason
            sourceIP: sourceIPs[0]
            userAgent: userAgent
      - timestamp:
          source: requestReceivedTimestamp
          format: RFC3339Nano
      - labels:
          verb:
          user:
          objectRef_resource:
          objectRef_namespace:
          responseStatus_code:

  - job_name: ingress-logs
    kubernetes_sd_configs:
      - role: pod
    pipeline_stages:
      - regex:
          expression: >-
            ^(?P<remote_addr>\S+)
            \s+-\s+
            \[(?P<time_local>[^\]]+)\]
            \s+"(?P<method>\S+)\s+(?P<path>\S+)\s+\S+"
            \s+(?P<status>\S+)
            \s+(?P<body_bytes>\S+)
            \s+"(?P<http_referer>[^"]*)"
            \s+"(?P<http_user_agent>[^"]*)"
            \s+(?P<request_length>\S+)
            \s+(?P<request_time>\S+)
            \s+\[(?P<proxy_upstream_name>[^\]]*)\]
            \s+(?P<upstream_addr>\S+)
            \s+(?P<upstream_response_length>\S+)
            \s+(?P<upstream_response_time>\S+)
            \s+(?P<upstream_status>\S+)
            \s+(?P<req_id>\S+)
      - regex:
          expression: "(?P<request_time_sec>\\d+).?(?P<request_time_msec>\\d+)?"
          source: request_time
      - timestamp:
          source: time_local
          format: "02/Jan/2006:15:04:05 -0700"
      - labels:
          method:
          status:
          path:
          upstream_status:
      - metrics:
          counters:
            - name: promtail_ingress_requests_total
              match:
                - ".*"
              prefix: ingress_nginx_
          histograms:
            - name: promtail_ingress_request_duration_seconds
              match:
                - ".*"
              prefix: ingress_nginx_
              buckets:
                - 0.005
                - 0.01
                - 0.025
                - 0.05
                - 0.1
                - 0.25
                - 0.5
                - 1.0
                - 2.5
                - 5.0
                - 10.0
    relabel_configs:
      - action: keep
        source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
        regex: ingress-nginx-controller
      - action: replace
        source_labels: [__meta_kubernetes_namespace]
        target_label: namespace
      - action: replace
        source_labels: [__meta_kubernetes_pod_name]
        target_label: pod

  - job_name: journal
    journal:
      json: false
      max_age: 12h
      path: /var/log/journal
      labels:
        job: systemd-journal
    relabel_configs:
      - action: labelmap
        regex: __journal__(.+)
    pipeline_stages:
      - labels:
          systemd_unit:

  - job_name: kubernetes-apiserver-audit
    static_configs:
      - targets: [localhost]
        labels:
          job: kubernetes-apiserver
          __path__: /var/log/kubernetes/kube-apiserver-audit.log
    pipeline_stages:
      - json:
          expressions:
            kind: kind
            resource: resource
            namespace: namespace
            name: name
            action: action
            status: status
            user: user.username
      - labels:
          kind:
          resource:
          action:
          status:
