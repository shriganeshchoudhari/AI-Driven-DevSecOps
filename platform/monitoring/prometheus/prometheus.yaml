global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s
  external_labels:
    cluster: aiops-platform-prod
    environment: prod
    region: us-west-2

rule_files:
  - /etc/prometheus/rules/alert-rules.yaml
  - /etc/prometheus/rules/recording-rules.yaml

scrape_configs:
  - job_name: kubernetes-apiservers
    kubernetes_sd_configs:
      - role: endpoints
    scheme: https
    tls_config:
      ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    relabel_configs:
      - source_labels:
          [__meta_kubernetes_namespace, __meta_kubernetes_service_name, __meta_kubernetes_endpoint_port_name]
        action: keep
        regex: default;kubernetes;https

  - job_name: kubernetes-nodes
    kubernetes_sd_configs:
      - role: node
    scheme: https
    tls_config:
      ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    relabel_configs:
      - action: labelmap
        regex: __meta_kubernetes_node_label_(.+)
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: >-
          (container_cpu_usage_seconds_total
          |container_memory_working_set_bytes
          |container_network_receive_bytes_total
          |container_network_transmit_bytes_total)
        action: keep

  - job_name: kubernetes-nodes-cadvisor
    kubernetes_sd_configs:
      - role: node
    scheme: https
    tls_config:
      ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    relabel_configs:
      - action: labelmap
        regex: __meta_kubernetes_node_label_(.+)
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: >-
          (container_cpu_usage_seconds_total
          |container_memory_working_set_bytes
          |container_network_receive_bytes_total
          |container_network_transmit_bytes_total
          |container_fs_usage_bytes
          |container_fs_limit_bytes
          |container_network_receive_errors_total
          |container_network_transmit_errors_total)
        action: keep

  - job_name: kubernetes-service-endpoints
    kubernetes_sd_configs:
      - role: endpoints
    relabel_configs:
      - action: keep
        regex: true
        source_labels: [__meta_kubernetes_service_annotation_prometheus_io_scrape]
      - action: replace
        regex: (https?)
        source_labels: [__meta_kubernetes_service_annotation_prometheus_io_scheme]
        target_label: __scheme__
      - action: replace
        regex: (.+)
        source_labels: [__meta_kubernetes_service_annotation_prometheus_io_path]
        target_label: __metrics_path__
      - action: replace
        regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2
        source_labels:
          [__address__, __meta_kubernetes_service_annotation_prometheus_io_port]
        target_label: __address__
      - action: labelmap
        regex: __meta_kubernetes_service_label_(.+)
      - action: replace
        source_labels: [__meta_kubernetes_namespace]
        target_label: kubernetes_namespace
      - action: replace
        source_labels: [__meta_kubernetes_service_name]
        target_label: kubernetes_service
      - action: replace
        source_labels: [__meta_kubernetes_pod_name]
        target_label: kubernetes_pod

  - job_name: kubernetes-pods
    kubernetes_sd_configs:
      - role: pod
    relabel_configs:
      - action: keep
        regex: true
        source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
      - action: replace
        regex: (.+)
        source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        target_label: __metrics_path__
      - action: replace
        regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2
        source_labels:
          [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
        target_label: __address__
      - action: labelmap
        regex: __meta_kubernetes_pod_label_(.+)
      - action: replace
        source_labels: [__meta_kubernetes_namespace]
        target_label: kubernetes_namespace
      - action: replace
        source_labels: [__meta_kubernetes_pod_name]
        target_label: kubernetes_pod
      - action: drop
        regex: Pending|Succeeded|Failed
        source_labels: [__meta_kubernetes_pod_phase]

  - job_name: kubernetes-service-endpoints-slow
    kubernetes_sd_configs:
      - role: endpoints
    scrape_interval: 5m
    scrape_timeout: 30s
    relabel_configs:
      - action: keep
        regex: true
        source_labels:
          [__meta_kubernetes_service_annotation_prometheus_io_scrape_slow]

  - job_name: kubernetes-services
    kubernetes_sd_configs:
      - role: service
    metrics_path: /probe
    params:
      module: [http_2xx]
    relabel_configs:
      - action: keep
        regex: true
        source_labels:
          [__meta_kubernetes_service_annotation_prometheus_io_probe]
      - source_labels: [__address__]
        target_label: __param_target
      - action: replace
        target_label: __address__
        source_labels: [__meta_kubernetes_service_name]
        regex: (.+)
        replacement: blackbox-exporter.monitoring:9115
      - source_labels: [__param_target]
        target_label: instance
      - action: labelmap
        regex: __meta_kubernetes_service_label_(.+)
      - action: replace
        source_labels: [__meta_kubernetes_namespace]
        target_label: kubernetes_namespace
      - action: replace
        source_labels: [__meta_kubernetes_service_name]
        target_label: kubernetes_service

  - job_name: kubelet
    kubernetes_sd_configs:
      - role: node
    scheme: https
    tls_config:
      ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
      insecure_skip_verify: false
    bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    relabel_configs:
      - action: labelmap
        regex: __meta_kubernetes_node_label_(.+)

  - job_name: kube-state-metrics
    kubernetes_sd_configs:
      - role: endpoints
        namespaces:
          names: [monitoring]
    relabel_configs:
      - action: keep
        source_labels: [__meta_kubernetes_service_label_app_kubernetes_io_name]
        regex: kube-state-metrics

  - job_name: kube-state-metrics-self
    static_configs:
      - targets: ["kube-state-metrics.monitoring:8080"]

  - job_name: node-exporter
    kubernetes_sd_configs:
      - role: endpoints
        namespaces:
          names: [monitoring]
    relabel_configs:
      - action: keep
        source_labels: [__meta_kubernetes_service_label_app_kubernetes_io_name]
        regex: prometheus-node-exporter
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: >-
          (node_cpu_seconds_total
          |node_memory_MemTotal_bytes
          |node_memory_MemFree_bytes
          |node_memory_MemAvailable_bytes
          |node_filesystem_size_bytes
          |node_filesystem_avail_bytes
          |node_filesystem_usage_bytes
          |node_network_receive_bytes_total
          |node_network_transmit_bytes_total
          |node_network_receive_errors_total
          |node_network_transmit_errors_total
          |node_disk_io_time_seconds_total
          |node_disk_read_bytes_total
          |node_disk_written_bytes_total)
        action: keep

  - job_name: falco-events
    static_configs:
      - targets: ["falco.falco:8765"]
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: "falco.*"
        action: keep

  - job_name: argocd-metrics
    kubernetes_sd_configs:
      - role: endpoints
        namespaces:
          names: [argocd]
    relabel_configs:
      - action: keep
        source_labels: [__meta_kubernetes_service_label_app_kubernetes_io_name]
        regex: >-
          argocd-metrics
          |argocd-server-metrics
          |argocd-repo-server
          |argocd-applicationset-controller

  - job_name: argocd-api-server
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: [argocd]
    relabel_configs:
      - action: keep
        source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
        regex: argocd-api-server

  - job_name: tempo
    static_configs:
      - targets: ["tempo.monitoring:3200"]

  - job_name: aiops-engine
    kubernetes_sd_configs:
      - role: endpoints
        namespaces:
          names: [aiops-engine]
    relabel_configs:
      - action: keep
        source_labels:
          [__meta_kubernetes_service_label_app_kubernetes_io_name]
        regex: aiops-engine

  - job_name: kyverno-metrics
    kubernetes_sd_configs:
      - role: endpoints
        namespaces:
          names: [kyverno]
    relabel_configs:
      - action: keep
        source_labels:
          [__meta_kubernetes_service_label_app_kubernetes_io_name]
        regex: kyverno-metrics

  - job_name: cert-manager
    kubernetes_sd_configs:
      - role: endpoints
        namespaces:
          names: [cert-manager]
    relabel_configs:
      - action: keep
        source_labels:
          [__meta_kubernetes_service_label_app_kubernetes_io_name]
        regex: cert-manager

  - job_name: ingress-nginx
    kubernetes_sd_configs:
      - role: endpoint
        namespaces:
          names: [ingress-nginx]
    relabel_configs:
      - action: keep
        source_labels:
          [__meta_kubernetes_service_label_app_kubernetes_io_name]
        regex: ingress-nginx-controller

  - job_name: kubernetes-health
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          app: prometheus

alerting:
  alertmanagers:
    - kubernetes_sd_configs:
        - role: endpoints
          namespaces:
            names: [monitoring]
      relabel_configs:
        - action: keep
          source_labels:
            [__meta_kubernetes_service_label_app_kubernetes_io_name]
          regex: alertmanager
      scheme: http
      timeout: 10s
      api_version: v2
