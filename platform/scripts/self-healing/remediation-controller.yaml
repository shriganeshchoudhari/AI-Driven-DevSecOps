apiVersion: apps/v1
kind: Deployment
metadata:
  name: remediation-controller
  namespace: aiops-engine
  labels:
    app: remediation-controller
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: remediation-controller
  template:
    metadata:
      labels:
        app: remediation-controller
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
    spec:
      serviceAccountName: remediation-controller
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: controller
          image: 123456789.dkr.ecr.us-west-2.amazonaws.com/remediation-controller:latest
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          env:
            - name: AIOPS_ENGINE_URL
              value: "http://aiops-engine.aiops-engine:8080"
            - name: AUTO_REMEDIATION_ENABLED
              value: "false"
            - name: APPROVAL_REQUIRED
              value: "true"
            - name: KUBERNETES_IN_CLUSTER
              value: "true"
            - name: LOG_LEVEL
              value: "INFO"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: remediation-controller
  namespace: aiops-engine
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
spec:
  selector:
    app: remediation-controller
  ports:
    - port: 8080
      targetPort: http
      name: http
      protocol: TCP
  type: ClusterIP
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: remediation-controller
  namespace: aiops-engine
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: remediation-controller
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "daemonsets", "statefulsets"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: [""]
    resources: ["pods", "nodes", "services", "namespaces", "events", "configmaps"]
    verbs: ["get", "list", "watch", "patch", "delete"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: remediation-controller
subjects:
  - kind: ServiceAccount
    name: remediation-controller
    namespace: aiops-engine
roleRef:
  kind: ClusterRole
  name: remediation-controller
  apiGroup: rbac.authorization.k8s.io
