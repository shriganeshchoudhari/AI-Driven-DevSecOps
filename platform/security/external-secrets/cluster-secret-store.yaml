# =============================================================================
# ExternalSecret - Global/Rotated Secrets (used across services)
# =============================================================================

apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: global-secrets
  namespace: external-secrets
  labels:
    app: external-secrets
    cyber-secure: "true"
spec:
  refreshInterval: 30m
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: global-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: OTLP_ENDPOINT
      remoteRef:
        key: /platform/global/shared
        property: otlp_endpoint
    - secretKey: CLUSTER_NAME
      remoteRef:
        key: /platform/global/shared
        property: cluster_name
