---
# =============================================================================
# ClusterSecretStore - AWS Secrets Manager Provider
# All namespaces can reference this store for secret retrieval
# =============================================================================

apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
  labels:
    app: external-secrets
    cyber-secure: "true"
  annotations:
    description: "Cluster-wide secret store backed by AWS Secrets Manager"
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-west-2
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
          # Optional: specify a custom audience
          # audience: sts.amazonaws.com
---
# =============================================================================
# ClusterSecretStore - AWS Parameter Store (for non-secret configuration)
# =============================================================================

apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-parameter-store
  labels:
    app: external-secrets
    cyber-secure: "true"
spec:
  provider:
    aws:
      service: ParameterStore
      region: us-west-2
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
---
# =============================================================================
# ExternalSecret - Frontend Service
# =============================================================================

apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: app-secrets
  namespace: frontend-service
  labels:
    app: frontend-service
    cyber-secure: "true"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: app-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      metadata:
        labels:
          app: frontend-service
          cyber-secure: "true"
        annotations:
          cyber-secure/source: external-secrets
          cyber-secure/refreshed-at: "{{ now }}"
  data:
    - secretKey: API_KEY
      remoteRef:
        key: /platform/frontend-service/prod
        property: api_key
    - secretKey: DB_PASSWORD
      remoteRef:
        key: /platform/frontend-service/prod
        property: db_password
    - secretKey: JWT_SECRET
      remoteRef:
        key: /platform/frontend-service/prod
        property: jwt_secret
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: /platform/frontend-service/prod
        property: redis_password
---
