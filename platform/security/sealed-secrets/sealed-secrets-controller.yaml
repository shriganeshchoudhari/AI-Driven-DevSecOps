---
# =============================================================================
# Sealed Secrets Controller Configuration
# =============================================================================

apiVersion: v1
kind: ConfigMap
metadata:
  name: sealed-secrets-config
  namespace: kube-system
  labels:
    app: sealed-secrets
    cyber-secure: "true"
data:
  # Sealed Secrets controller configuration
  key-renew-period: "8760h"
  key-prefix: sealed-secrets
  update-status: "true"
  # Rate limiting for unseal operations
  rate-limit: "100/m"
---
# =============================================================================
# SealedSecret - Frontend Service Secrets
# =============================================================================

apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: app-secrets
  namespace: frontend-service
  labels:
    app: frontend-service
    cyber-secure: "true"
    sealed-secrets-bitnami/managed: "true"
  annotations:
    sealedsecrets.bitnami.com/cluster-wide: "false"
    sealedsecrets.bitnami.com/namespace-wide: "true"
spec:
  template:
    metadata:
      labels:
        app: frontend-service
        cyber-secure: "true"
      annotations:
        cyber-secure/source: sealed-secrets
    type: Opaque
