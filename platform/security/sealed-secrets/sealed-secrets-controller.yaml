# =============================================================================
# Sealed Secrets Controller (Deployment managed via Helm, this is the controller config)
# =============================================================================

apiVersion: v1
kind: Service
metadata:
  name: sealed-secrets-controller
  namespace: kube-system
  labels:
    app: sealed-secrets
    cyber-secure: "true"
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
spec:
  selector:
    app: sealed-secrets
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sealed-secrets-custom-labels
  namespace: kube-system
  labels:
    app: sealed-secrets
    cyber-secure: "true"
data:
  custom-labels.yaml: |
    labels:
      cyber-secure: "true"
      managed-by: sealed-secrets
